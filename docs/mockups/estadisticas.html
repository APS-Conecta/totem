<meta charset="utf-8">
<title>Maqueta Estadísticas Totem</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Review shell (themed) around ONE ordinary Nextcloud-style page.
   The product page is a normal responsive page inside NcContent/NcAppContent and uses Nextcloud's own variables
   (theming and dark mode come free); the mockup fakes those variables with --nc-*. The layout reads the width of
   the chosen frame (container query), the product reads the real viewport. */
:root {
  --bg: #f4f5f7; --fg: #13202b; --muted: #55606b; --line: #d5d9de; --panel: #ffffff; --accent: #6a12e0; --accent-fg: #ffffff;
  --nc-bg: #ffffff; --nc-fg: #222222; --nc-muted: #6b6b6b; --nc-line: #dddddd; --nc-soft: #f6f6f6; --nc-primary: #6a12e0; --nc-primary-fg: #ffffff;
  --nc-primary-soft: #f1ebff; --nc-err: #b3261e; --nc-err-soft: #fdecea; --gold: #f2b134;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e151c; --fg: #e8edf1; --muted: #9aa7b3; --line: #2a3744; --panel: #16212b; --accent: #a97bff; --accent-fg: #13202b;
    --nc-bg: #171717; --nc-fg: #ebebeb; --nc-muted: #a6a6a6; --nc-line: #3a3a3a; --nc-soft: #202020; --nc-primary: #a97bff; --nc-primary-fg: #13202b;
    --nc-primary-soft: #2b2142; --nc-err: #ff8a80; --nc-err-soft: #3b1f1d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e151c; --fg: #e8edf1; --muted: #9aa7b3; --line: #2a3744; --panel: #16212b; --accent: #a97bff; --accent-fg: #13202b;
  --nc-bg: #171717; --nc-fg: #ebebeb; --nc-muted: #a6a6a6; --nc-line: #3a3a3a; --nc-soft: #202020; --nc-primary: #a97bff; --nc-primary-fg: #13202b;
  --nc-primary-soft: #2b2142; --nc-err: #ff8a80; --nc-err-soft: #3b1f1d; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; line-height: 1.45;
  padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 1.5rem; line-height: 1.15; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 70ch; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 14px; color: var(--muted); }
.bar select { font: inherit; font-size: 14px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.frame-outer { overflow-x: auto; }
.frame { margin: 0 auto; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; container: pg / inline-size; width: var(--w, 100%); max-width: 100%; }

/* ===== the page ===== */
.nc { background: var(--nc-bg); color: var(--nc-fg); }
.nc-top { height: 50px; background: #6a12e0; color: #fff; display: flex; align-items: center; padding: 0 20px; gap: 20px; font-weight: 700; }
.nc-top span { font-weight: 400; opacity: .85; }
.page { padding: 24px 28px 36px; display: flex; flex-direction: column; gap: 26px; min-width: 0; }
.page button { font: inherit; }
.bar-top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.seg { display: inline-flex; border: 1px solid var(--nc-line); border-radius: 10px; overflow: hidden; }
.seg button { padding: 9px 18px; min-height: 44px; border: 0; background: var(--nc-bg); color: var(--nc-fg); cursor: pointer; font-weight: 600; }
.seg button + button { border-left: 1px solid var(--nc-line); }
.seg button[aria-pressed="true"] { background: var(--nc-primary); color: var(--nc-primary-fg); }
.when { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.when .label { font-size: 1.25rem; font-weight: 700; padding: 0 8px; min-width: 0; text-wrap: balance; }
.when .arrow { width: 44px; height: 44px; border: 1px solid var(--nc-line); border-radius: 10px; background: var(--nc-bg); color: var(--nc-fg); cursor: pointer; font-size: 22px; line-height: 1; }
.when .arrow:disabled { opacity: .35; cursor: not-allowed; }
.acts { margin-left: auto; display: inline-flex; flex-wrap: wrap; gap: 8px; }
.btn { min-height: 44px; padding: 8px 16px; border: 1px solid var(--nc-line); border-radius: 10px; background: var(--nc-bg); color: var(--nc-fg); cursor: pointer; font-weight: 600; }
.btn.primary { background: var(--nc-primary); border-color: var(--nc-primary); color: var(--nc-primary-fg); }
.page :focus-visible { outline: 3px solid var(--nc-primary); outline-offset: 2px; }

.figures { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 3px solid var(--nc-fg); }
.figure { padding: 12px 14px 4px 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.figure + .figure { padding-left: 14px; border-left: 1px solid var(--nc-line); }
.figure .n { font-size: clamp(1.6rem, 4.2cqw, 3rem); font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.figure.main .n { font-size: clamp(2rem, 6cqw, 4rem); }
.figure .t { color: var(--nc-muted); font-size: 14px; }
.figure.main { grid-column: span 1; }

section h2 { margin: 0 0 4px; font-size: 1.25rem; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
section h2 small { font-weight: 400; color: var(--nc-muted); font-size: 14px; }
.scroll { overflow-x: auto; min-width: 0; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 640px; }
caption { text-align: left; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
th, td { padding: 10px 10px; text-align: right; border-bottom: 1px solid var(--nc-line); white-space: nowrap; }
th { font-weight: 400; color: var(--nc-muted); font-size: 14px; vertical-align: bottom; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--nc-bg); }
thead tr.grp th { text-align: center; border-bottom: 0; padding-bottom: 0; }
thead tr.grp th.span { border-bottom: 1px solid var(--nc-line); padding-bottom: 4px; }
tbody th { color: inherit; font-size: 16px; font-weight: 600; white-space: normal; }
tbody th .sw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
tbody th .off { font-weight: 400; color: var(--nc-muted); font-size: 13px; margin-left: 6px; }
tfoot td, tfoot th { font-weight: 700; border-top: 2px solid var(--nc-fg); border-bottom: 0; color: var(--nc-fg); font-size: 16px; }
td.emit { font-weight: 700; }
td.zero { color: var(--nc-muted); }
tr.future td, tr.future th { color: var(--nc-muted); }
.state { border: 1px dashed var(--nc-line); border-radius: 10px; padding: 18px 20px; color: var(--nc-muted); background: var(--nc-soft); }
.state.err { border: 1px solid var(--nc-err); color: var(--nc-err); background: var(--nc-err-soft); }
.note { color: var(--nc-muted); font-size: 14px; max-width: 80ch; margin: 0; }

@container pg (max-width: 900px) {
  .page { padding: 18px 16px 28px; gap: 22px; }
  .figures { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .figure:nth-child(4) { padding-left: 0; border-left: 0; }
  .figure:nth-child(n + 4) { border-top: 1px solid var(--nc-line); margin-top: 8px; padding-top: 14px; }
  .acts { margin-left: 0; }
}
@container pg (max-width: 520px) {
  th, td { padding: 9px 7px; }
  tbody th { min-width: 7.5em; }
  .figures { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .figure:nth-child(n) { padding-left: 14px; border-left: 1px solid var(--nc-line); }
  .figure:nth-child(odd) { padding-left: 0; border-left: 0; }
  .figure:nth-child(n + 3) { border-top: 1px solid var(--nc-line); margin-top: 8px; padding-top: 14px; }
  .seg { width: 100%; } .seg button { flex: 1; padding-inline: 8px; }
  .when { width: 100%; justify-content: space-between; }
  .when .label { flex: 1; text-align: center; font-size: 1.05rem; }
  .acts { width: 100%; } .acts .btn { flex: 1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<div class="wrap">
  <h1>Maqueta: Estadísticas</h1>
  <p class="lede">Una página normal de Nextcloud, para cualquier usuario con sesión. Solo cuentas absolutas de tickets: ningún porcentaje, promedio ni gráfico, y ningún dato de personas. Cambie la vista y el ancho para revisar cada estado; el período, las flechas y la descarga funcionan.</p>
  <div class="bar" role="group" aria-label="Revisión">
    <label>Vista
      <select id="view">
        <option value="data">Con datos</option>
        <option value="empty">Sin tickets en el período</option>
        <option value="nosectors">Ninguna unidad marcada como sector</option>
        <option value="error">Error al cargar</option>
      </select>
    </label>
    <label>Ancho
      <select id="width">
        <option value="">Todo el ancho</option>
        <option value="1280px">Portátil 1280</option>
        <option value="820px">Tableta 820</option>
        <option value="390px">Teléfono 390</option>
        <option value="340px">Teléfono pequeño 340</option>
      </select>
    </label>
    <label>Tema
      <select id="theme"><option value="">Del sistema</option><option value="light">Claro</option><option value="dark">Oscuro</option></select>
    </label>
  </div>
  <div class="frame-outer"><div class="frame" id="frame"><div class="nc" id="page"></div></div></div>
</div>

<script>
/* Sample data. One deterministic generator feeds every figure, so the numbers always add up
   (emitidos = atendidos + no se presentó + sin atender) the way the real board guarantees. */
const TODAY = '2026-10-21';
const SERVICIOS = [
  { id: 1, name: 'Sector Azul', color: '#2b6cb0', sector: true },
  { id: 2, name: 'Sector Verde', color: '#2f855a', sector: true },
  { id: 3, name: 'Sector Rojo', color: '#c53030', sector: true },
  { id: 4, name: 'Sector Naranjo', color: '#c05621', sector: true, idle: true },
  { id: 5, name: 'Farmacia', color: '#0b6e69' },
  { id: 6, name: 'Toma de Muestras', color: '#b7791f' },
  { id: 7, name: 'Vacunatorio', color: '#6b46c1' },
  { id: 8, name: 'Dental', color: '#718096', off: true, onlyBefore: '2026-10-12' },
];
const DAYNAMES = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const iso = (d) => d.toISOString().slice(0, 10);
const parse = (s) => new Date(s + 'T00:00:00Z');
const add = (s, n) => { const d = parse(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const zero = () => ({ emitidos: 0, atendidos: 0, noShow: 0, sinAtender: 0 });
const plus = (a, b) => { for (const k in a) a[k] += b[k]; return a; };

function cell(day, s) {                       // preferente + general counts of one servicio on one day
  const d = parse(day), wd = d.getUTCDay();
  const gen = { p: zero(), g: zero() };
  if (wd === 0 || wd === 6 || day > TODAY || s.idle || (s.onlyBefore && day >= s.onlyBefore)) return gen;
  const n = d.getUTCDate();
  const p = 5 + ((n * 5 + s.id * 3) % 9);
  const g = 18 + ((n * 7 + s.id * 13) % 25);
  const live = day === TODAY;                 // today is still in progress
  const noShow = live ? 1 : (n + s.id) % 4;
  const open = live ? Math.round((p + g) * 0.35) : ((n + s.id) % 3 === 0 ? 1 : 0);
  const gg = live ? Math.round(g * 0.6) : g, pp = live ? Math.round(p * 0.6) : p;
  gen.p = { emitidos: pp, atendidos: pp - (live ? Math.min(open, pp) : 0), noShow: 0, sinAtender: live ? Math.min(open, pp) : 0 };
  const rest = open - (live ? Math.min(open, pp) : 0);
  gen.g = { emitidos: gg, atendidos: gg - noShow - rest, noShow, sinAtender: rest };
  return gen;
}

function period(kind, offset) {
  if (kind === 'day') { const from = add(TODAY, offset); return { from, to: from }; }
  if (kind === 'week') { const wd = (parse(TODAY).getUTCDay() + 6) % 7; const from = add(TODAY, -wd + 7 * offset); return { from, to: add(from, 6) }; }
  const t = parse(TODAY); const first = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + offset, 1));
  return { from: iso(first), to: iso(new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + 1, 0))) };
}
const daysOf = (p) => { const out = []; for (let d = p.from; d <= p.to; d = add(d, 1)) out.push(d); return out; };
const fmt = (s, o) => parse(s).toLocaleDateString('es-CL', Object.assign({ timeZone: 'UTC' }, o));
function label(kind, p) {
  if (kind === 'day') return fmt(p.from, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  if (kind === 'month') return fmt(p.from, { month: 'long', year: 'numeric' });
  const a = parse(p.from), b = parse(p.to);
  return a.getUTCMonth() === b.getUTCMonth()
    ? `Semana del ${a.getUTCDate()} al ${b.getUTCDate()} de ${MONTHS[b.getUTCMonth()]} de ${b.getUTCFullYear()}`
    : `Semana del ${a.getUTCDate()} de ${MONTHS[a.getUTCMonth()]} al ${b.getUTCDate()} de ${MONTHS[b.getUTCMonth()]} de ${b.getUTCFullYear()}`;
}

let state = { kind: 'week', offset: 0 };
function board() {
  const p = period(state.kind, state.offset), days = daysOf(p);
  const rows = SERVICIOS.map((s) => {
    const row = { s, p: zero(), g: zero() };
    days.forEach((d) => { const c = cell(d, s); plus(row.p, c.p); plus(row.g, c.g); });
    return row;
  }).filter((r) => !(r.s.off && r.p.emitidos + r.g.emitidos === 0));
  const perDay = days.map((d) => { const r = { d, p: zero(), g: zero() }; SERVICIOS.forEach((s) => { const c = cell(d, s); plus(r.p, c.p); plus(r.g, c.g); }); return r; });
  return { p, days, rows, perDay };
}
const tot = (r) => plus(plus(zero(), r.p), r.g);
const sum = (list) => list.reduce((acc, r) => { plus(acc.p, r.p); plus(acc.g, r.g); return acc; }, { p: zero(), g: zero() });
const num = (n, dash) => dash ? '–' : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function rowHtml(r, kindOfRow) {
  const t = tot(r), z = (n) => (n === 0 ? ' class="zero"' : '');
  const head = kindOfRow === 'servicio'
    ? `<th scope="row"><span class="sw" style="background:${r.s.color}" aria-hidden="true"></span>${esc(r.s.name)}${r.s.off ? '<span class="off">desactivado</span>' : ''}</th>`
    : `<th scope="row">${esc(r.label)}</th>`;
  const f = r.future;
  return `<tr${f ? ' class="future"' : ''}>${head}<td${z(r.p.emitidos)}>${num(r.p.emitidos, f)}</td><td${z(r.g.emitidos)}>${num(r.g.emitidos, f)}</td><td class="emit">${num(t.emitidos, f)}</td>` +
    `<td${z(t.atendidos)}>${num(t.atendidos, f)}</td><td${z(t.noShow)}>${num(t.noShow, f)}</td><td${z(t.sinAtender)}>${num(t.sinAtender, f)}</td></tr>`;
}
function table(caption, first, rows, foot, kindOfRow) {
  return `<div class="scroll"><table><caption class="sr">${caption}</caption><thead>` +
    `<tr class="grp"><th></th><th class="span" colspan="3" scope="colgroup">Tickets emitidos</th><th colspan="3"></th></tr>` +
    `<tr><th scope="col">${first}</th><th scope="col">Preferente</th><th scope="col">General</th><th scope="col">Total</th><th scope="col">Atendidos</th><th scope="col">No se presentó</th><th scope="col">Sin atender</th></tr></thead>` +
    `<tbody>${rows.map((r) => rowHtml(r, kindOfRow)).join('')}</tbody>` +
    (foot ? `<tfoot><tr><th scope="row">${foot.label}</th><td>${num(foot.p.emitidos)}</td><td>${num(foot.g.emitidos)}</td><td>${num(tot(foot).emitidos)}</td><td>${num(tot(foot).atendidos)}</td><td>${num(tot(foot).noShow)}</td><td>${num(tot(foot).sinAtender)}</td></tr></tfoot>` : '') +
    `</table></div>`;
}

function render() {
  const view = document.getElementById('view').value;
  const b = board(), p = b.p;
  const isCurrent = p.to >= TODAY && p.from <= TODAY;
  const empty = view === 'empty';
  let rows = b.rows.map((r) => empty ? { s: r.s, p: zero(), g: zero() } : r);
  let perDay = b.perDay.map((r) => empty ? { d: r.d, p: zero(), g: zero() } : r);
  const sectors = view === 'nosectors' ? [] : rows.filter((r) => r.s.sector);
  const others = view === 'nosectors' ? rows : rows.filter((r) => !r.s.sector);
  const all = sum(rows);
  const T = tot(all);

  const figures = [
    ['Tickets emitidos', T.emitidos, 'main'], ['Preferentes', all.p.emitidos], ['Generales', all.g.emitidos],
    ['Atendidos', T.atendidos], ['No se presentó', T.noShow], ['Sin atender', T.sinAtender],
  ].map(([t, n, c]) => `<div class="figure ${c || ''}"><div class="n">${num(n)}</div><div class="t">${t}</div></div>`).join('');

  const days = perDay.map((r) => ({ ...r, label: fmt(r.d, { weekday: 'short', day: 'numeric', month: 'short' }), future: r.d > TODAY }));
  const sectorBlock = sectors.length
    ? table('Tickets por sector', 'Sector', sectors, { ...sum(sectors), label: 'Total sectores' }, 'servicio')
    : `<div class="state">Ninguna unidad está marcada como sector. Márquela en Configuración, en Unidades.</div>`;
  const note = empty ? `<div class="state">Sin tickets en este período.</div>` : '';

  document.getElementById('page').innerHTML = `
    <div class="nc-top">Totem <span>Estadísticas</span></div>
    <main class="page">
      <div class="bar-top">
        <div class="seg" role="group" aria-label="Período">${['day', 'week', 'month'].map((k) => `<button type="button" data-kind="${k}" aria-pressed="${state.kind === k}">${{ day: 'Día', week: 'Semana', month: 'Mes' }[k]}</button>`).join('')}</div>
        <div class="when"><button class="arrow" type="button" data-step="-1" aria-label="Período anterior">‹</button><span class="label" aria-live="polite">${label(state.kind, p)}</span><button class="arrow" type="button" data-step="1" aria-label="Período siguiente" ${isCurrent ? 'disabled' : ''}>›</button></div>
        <div class="acts"><button class="btn" type="button" data-act="refresh">Actualizar</button><button class="btn primary" type="button" data-act="csv">Descargar CSV</button></div>
      </div>
      ${view === 'error' ? `<div class="state err" role="alert">No se pudieron cargar las estadísticas. Revise la conexión e intente de nuevo.</div>` : `
      ${note}
      <div class="figures" role="group" aria-label="Totales del período">${figures}</div>
      <section><h2>Sectores <small>Unidades marcadas como sector</small></h2>${sectorBlock}</section>
      <section><h2>Otras unidades</h2>${others.length ? table('Tickets por unidad', 'Unidad', others, { ...sum(others), label: 'Total otras unidades' }, 'servicio') : '<div class="state">No hay otras unidades.</div>'}</section>
      ${state.kind === 'day' ? '' : `<section><h2>Por día</h2>${table('Tickets por día', 'Día', days, { ...sum(rows), label: 'Total del período' }, 'dia')}</section>`}`}
      <p class="note">Se cuentan tickets, no personas: quien saca dos tickets cuenta dos veces. No se guarda ningún dato personal. “Sin atender” son los tickets que quedaron esperando, llamados o en atención al terminar el día.</p>
    </main>`;
}

document.getElementById('page').addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.kind) { state = { kind: t.dataset.kind, offset: 0 }; }
  else if (t.dataset.step) { state.offset = Math.min(0, Math.max(-60, state.offset + Number(t.dataset.step))); }
  else if (t.dataset.act === 'csv') { t.textContent = 'CSV de muestra (en el producto se descarga)'; setTimeout(render, 1600); return; }
  else if (t.dataset.act !== 'refresh') return;
  render();
});
document.getElementById('view').addEventListener('change', render);
document.getElementById('width').addEventListener('change', (e) => document.getElementById('frame').style.setProperty('--w', e.target.value || '100%'));
document.getElementById('theme').addEventListener('change', (e) => { const v = e.target.value; if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme; });
render();
</script>
