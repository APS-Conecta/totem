# Keep the toolchain current so the security tabs stay empty (#81).
#
# Weekly Monday 06:00 UTC, one grouped PR per ecosystem (npm is split dev/prod
# because dependabot-auto-merge.yml merges dev groups at any semver level and
# prod bumps only when every change is a patch). Conventional commit prefixes
# match the repo's history.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    # @nextcloud/webpack-vue-config pins this peer to an exact version
    # ("4.0.0"), so any Dependabot bump of it fails `npm ci` with ERESOLVE —
    # seen on #83. It moves when webpack-vue-config moves, by human hands.
    ignore:
      - dependency-name: "node-polyfill-webpack-plugin"
      # The offline voice asset copier needs ONNX Runtime 1.18's WASM files
      # (docs/adr/0005). Upgrade the runtime and its packaging together.
      - dependency-name: "onnxruntime-web"
    groups:
      npm-development-dependencies:
        dependency-type: "development"
      npm-production-dependencies:
        dependency-type: "production"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    labels:
      - dependencies

  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      composer-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
