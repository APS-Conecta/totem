# Keep the toolchain current so the security tabs stay empty (#81).
#
# Weekly Monday 06:00 UTC, one grouped PR per ecosystem, npm split dev/prod.
# Groups carry minor and patch bumps only; every major becomes its own PR —
# the auto-merge gate never merges a major, and @nextcloud/webpack-vue-config
# pins its peers' major lanes, so grouped majors only ever red-build (#83, #87).
# Conventional commit prefixes match the repo's history.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    # @nextcloud/webpack-vue-config pins this peer to an exact version
    # ("4.0.0"), so any Dependabot bump of it fails `npm ci` with ERESOLVE —
    # seen on #83. It moves when webpack-vue-config moves, by human hands.
    ignore:
      - dependency-name: "node-polyfill-webpack-plugin"
    groups:
      npm-development-dependencies:
        dependency-type: "development"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      npm-production-dependencies:
        dependency-type: "production"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    labels:
      - dependencies

  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      composer-dependencies:
        patterns: ["*"]
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "chore"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns: ["*"]
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
