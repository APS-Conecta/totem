# Throwaway Nextcloud instance for developing this app.
#
# NOT the gestion instance: it shares none of its .env, provisioning or data. It
# exists to run what the bare `make test` harness cannot — mappers, the seed,
# occ — without touching the real stack. Throw it away whenever it gets in the
# way (`make instance-clean`).
#
# Same images as gestion/compose.yaml, to share layers and test against the
# real versions. Loopback only, on 8094, clear of the other dev stacks.
name: totem-dev

services:
  db:
    image: postgres:18-alpine
    restart: "no"
    volumes:
      # postgres:18+ stores data in a major-version subdir, so mount the
      # parent, not /data (territorio's comment, learned the hard way).
      - dev_postgres:/var/lib/postgresql
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 5s
      timeout: 5s
      retries: 10

  nextcloud:
    image: nextcloud:34-apache
    restart: "no"
    ports:
      - "127.0.0.1:8094:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - dev_nextcloud:/var/www/html
      # The repo itself mounted as the app: edit here, see it live, no copy and
      # no rebuild.
      - .:/var/www/html/custom_apps/totem
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: dev
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/status.php || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # A stand-in network ticket printer for the end-to-end tests (e2e/fake-printer.cjs): the Nextcloud container
  # reaches it at the host name `printer`, port 9100; a test reads what it received on 127.0.0.1:9191.
  printer:
    image: node:22-alpine
    restart: "no"
    ports:
      - "127.0.0.1:9191:9101"
    volumes:
      - ./e2e/fake-printer.cjs:/app/fake-printer.cjs:ro
    command: ["node", "/app/fake-printer.cjs"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9101/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dev_postgres:
  dev_nextcloud: